<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="50%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#091428" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="140" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>
  <circle cx="600" cy="280" r="150" fill="#06b6d4" opacity="0.08" filter="blur(50px)"/>
  <circle cx="400" cy="220" r="120" fill="#10b981" opacity="0.05" filter="blur(40px)"/>

  <!-- Header Banner in Diagram -->
  <rect x="40" y="25" width="720" height="40" rx="8" fill="#111c38" stroke="#1e293b" stroke-width="1"/>
  <circle cx="65" cy="45" r="5" fill="#ef4444"/>
  <circle cx="82" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="45" r="5" fill="#10b981"/>
  <text x="120" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">SYSTEM ARCHITECTURE: AUTONOMOUS IOT IRRIGATION &amp; SENSOR TELEMETRY</text>
  <rect x="660" y="33" width="85" height="24" rx="12" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="675" y="49" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">LIVE ESP32</text>

  <!-- Left Block: Sensor Array -->
  <g transform="translate(60, 95)" filter="url(#cardShadow)">
    <rect width="200" height="305" rx="12" fill="#0f1a30" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="15" y="15" width="170" height="28" rx="6" fill="#1e293b"/>
    <text x="25" y="34" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">🌱 SENSOR SUITE</text>

    <!-- Sensor 1 -->
    <rect x="15" y="55" width="170" height="50" rx="8" fill="#14213d" stroke="#334155" stroke-width="1"/>
    <text x="25" y="73" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">BH1750 Ambient Light</text>
    <text x="25" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">I2C • 0 - 65,535 Lux</text>

    <!-- Sensor 2 -->
    <rect x="15" y="115" width="170" height="50" rx="8" fill="#14213d" stroke="#334155" stroke-width="1"/>
    <text x="25" y="133" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">MLX90614 Non-Contact</text>
    <text x="25" y="152" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">IR Temp • Plant Stress</text>

    <!-- Sensor 3 -->
    <rect x="15" y="175" width="170" height="50" rx="8" fill="#14213d" stroke="#334155" stroke-width="1"/>
    <text x="25" y="193" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">BMP280 Barometric</text>
    <text x="25" y="212" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Pressure + Humidity/VPD</text>

    <!-- Sensor 4 -->
    <rect x="15" y="235" width="170" height="50" rx="8" fill="#14213d" stroke="#334155" stroke-width="1"/>
    <text x="25" y="253" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Soil Moisture Probe</text>
    <text x="25" y="272" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">ADC Thresholds (0-100%)</text>
  </g>

  <!-- Middle Block: Controller & Logic Engine -->
  <g transform="translate(300, 95)" filter="url(#cardShadow)">
    <rect width="200" height="305" rx="12" fill="#0f1a30" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="15" y="15" width="170" height="28" rx="6" fill="#1e293b"/>
    <text x="25" y="34" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="12" font-weight="700">⚡ ESP32 / ARDUINO CORE</text>

    <!-- Logic Box 1 -->
    <rect x="15" y="55" width="170" height="65" rx="8" fill="#13243a" stroke="#0284c7" stroke-width="1"/>
    <text x="25" y="74" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">VPD &amp; Stress Algorithm</text>
    <text x="25" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">VPD = VPsat - VPact</text>
    <text x="25" y="107" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Dynamic Watering Calc</text>

    <!-- Logic Box 2 -->
    <rect x="15" y="130" width="170" height="65" rx="8" fill="#13243a" stroke="#0284c7" stroke-width="1"/>
    <text x="25" y="149" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Relay &amp; Valve Driver</text>
    <text x="25" y="167" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">GPIO Optocoupled Relay</text>
    <text x="25" y="182" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Submersible Pump On/Off</text>

    <!-- Logic Box 3 -->
    <rect x="15" y="205" width="170" height="80" rx="8" fill="#13243a" stroke="#0284c7" stroke-width="1"/>
    <text x="25" y="224" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Dual Mode Logic</text>
    <text x="25" y="243" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10">Mode 1: Auto Adaptive</text>
    <text x="25" y="259" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Mode 2: Cloud Override</text>
    <text x="25" y="275" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Fail-Safe Timeout Guard</text>
  </g>

  <!-- Right Block: Cloud & Dashboard -->
  <g transform="translate(540, 95)" filter="url(#cardShadow)">
    <rect width="200" height="305" rx="12" fill="#0f1a30" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="15" y="15" width="170" height="28" rx="6" fill="#1e293b"/>
    <text x="25" y="34" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="700">📱 BLYNK CLOUD &amp; APP</text>

    <!-- Dashboard Widget 1 -->
    <rect x="15" y="55" width="170" height="60" rx="8" fill="#132a2e" stroke="#059669" stroke-width="1"/>
    <text x="25" y="74" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Live Telemetry Gauges</text>
    <text x="25" y="93" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">Soil: 48% • Temp: 28.4°C</text>
    <text x="25" y="108" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Lux: 12,400 • Press: 1013hPa</text>

    <!-- Dashboard Widget 2 -->
    <rect x="15" y="125" width="170" height="70" rx="8" fill="#132a2e" stroke="#059669" stroke-width="1"/>
    <text x="25" y="144" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Remote Controls</text>
    <rect x="25" y="153" width="65" height="24" rx="4" fill="#059669"/>
    <text x="32" y="169" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700">AUTO ON</text>
    <rect x="98" y="153" width="75" height="24" rx="4" fill="#1e293b" stroke="#059669" stroke-width="1"/>
    <text x="105" y="169" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="600">PUMP TRIP</text>

    <!-- Dashboard Widget 3 -->
    <rect x="15" y="205" width="170" height="80" rx="8" fill="#132a2e" stroke="#059669" stroke-width="1"/>
    <text x="25" y="224" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Alerts &amp; Event Stream</text>
    <text x="25" y="243" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10">Push: "Soil Moisture Low"</text>
    <text x="25" y="259" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Auto-cycle: 150ml applied</text>
    <text x="25" y="275" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Next sync: in 5 sec</text>
  </g>

  <!-- Connecting Bus Lines with Flow Arrows -->
  <g stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.8">
    <path d="M 260 170 L 300 170"/>
    <path d="M 260 230 L 300 230"/>
    <path d="M 260 290 L 300 290"/>
  </g>
  <polygon points="298,170 290,165 290,175" fill="#3b82f6"/>
  <polygon points="298,230 290,225 290,235" fill="#3b82f6"/>
  <polygon points="298,290 290,285 290,295" fill="#3b82f6"/>

  <g stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.8">
    <path d="M 500 200 L 540 200"/>
    <path d="M 500 260 L 540 260"/>
  </g>
  <polygon points="538,200 530,195 530,205" fill="#06b6d4"/>
  <polygon points="538,260 530,255 530,265" fill="#06b6d4"/>

  <!-- Footer Tag -->
  <text x="400" y="425" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Vansh Saini • IoT &amp; Embedded Systems Research &amp; Prototyping (2025–2026)</text>
</svg>
