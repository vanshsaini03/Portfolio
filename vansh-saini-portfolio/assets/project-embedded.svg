<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="50%" stop-color="#141838" />
      <stop offset="100%" stop-color="#0b1021" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.5"/>
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" opacity="0.3"/>
    </pattern>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  <rect width="800" height="450" fill="url(#circuitGrid)"/>

  <!-- Ambient Glows -->
  <circle cx="620" cy="180" r="160" fill="#8b5cf6" opacity="0.08" filter="blur(50px)"/>
  <circle cx="220" cy="300" r="140" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>

  <!-- Header Banner -->
  <rect x="40" y="25" width="720" height="40" rx="8" fill="#141b3a" stroke="#2a335c" stroke-width="1"/>
  <circle cx="65" cy="45" r="5" fill="#ef4444"/>
  <circle cx="82" cy="45" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="45" r="5" fill="#10b981"/>
  <text x="120" y="50" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">HARDWARE INTERFACING &amp; EMBEDDED AUTOMATION BENCH</text>
  <rect x="655" y="33" width="90" height="24" rx="12" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="668" y="49" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11" font-weight="600">PROTOTYPE</text>

  <!-- Circuit Graphic Nodes & Microcontroller Representation -->
  <g transform="translate(60, 95)" filter="url(#cardGlow)">
    <rect width="210" height="305" rx="12" fill="#111833" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="15" y="15" width="180" height="28" rx="6" fill="#1e2448"/>
    <text x="25" y="34" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">🔌 TRANSDUCERS &amp; INPUTS</text>

    <!-- Card item 1 -->
    <rect x="15" y="55" width="180" height="50" rx="8" fill="#182042" stroke="#2e386b" stroke-width="1"/>
    <text x="25" y="73" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Analog &amp; Digital Sensors</text>
    <text x="25" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">PIR • Ultrasonic • Temp</text>

    <!-- Card item 2 -->
    <rect x="15" y="115" width="180" height="50" rx="8" fill="#182042" stroke="#2e386b" stroke-width="1"/>
    <text x="25" y="133" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Signal Conditioning</text>
    <text x="25" y="152" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Voltage Dividers &amp; Pull-ups</text>

    <!-- Card item 3 -->
    <rect x="15" y="175" width="180" height="50" rx="8" fill="#182042" stroke="#2e386b" stroke-width="1"/>
    <text x="25" y="193" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Bus Protocols</text>
    <text x="25" y="212" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">I2C • SPI • UART Serial</text>

    <!-- Card item 4 -->
    <rect x="15" y="235" width="180" height="50" rx="8" fill="#182042" stroke="#2e386b" stroke-width="1"/>
    <text x="25" y="253" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Power Regulation</text>
    <text x="25" y="272" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">3.3V / 5V DC Rails • LDOs</text>
  </g>

  <!-- MCU Logic Center -->
  <g transform="translate(300, 95)" filter="url(#cardGlow)">
    <rect width="200" height="305" rx="12" fill="#111833" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="15" y="15" width="170" height="28" rx="6" fill="#1e2448"/>
    <text x="25" y="34" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">⚙️ FIRMWARE ENGINE</text>

    <rect x="15" y="55" width="170" height="70" rx="8" fill="#162248" stroke="#1d4ed8" stroke-width="1"/>
    <text x="25" y="74" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Arduino &amp; C/C++ Logic</text>
    <text x="25" y="93" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Non-blocking Timers (millis)</text>
    <text x="25" y="109" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Interrupt Service Routines</text>

    <rect x="15" y="135" width="170" height="70" rx="8" fill="#162248" stroke="#1d4ed8" stroke-width="1"/>
    <text x="25" y="154" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Wireless Connectivity</text>
    <text x="25" y="173" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">ESP32 Wi-Fi 802.11 b/g/n</text>
    <text x="25" y="189" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">MQTT / REST Telemetry</text>

    <rect x="15" y="215" width="170" height="70" rx="8" fill="#162248" stroke="#1d4ed8" stroke-width="1"/>
    <text x="25" y="234" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Error Handling &amp; Watchdog</text>
    <text x="25" y="253" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10">Hardware WDT Reset</text>
    <text x="25" y="269" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Graceful Failover System</text>
  </g>

  <!-- Output Actuators and Relays -->
  <g transform="translate(530, 95)" filter="url(#cardGlow)">
    <rect width="210" height="305" rx="12" fill="#111833" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="15" y="15" width="180" height="28" rx="6" fill="#1e2448"/>
    <text x="25" y="34" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="12" font-weight="700">⚡ ACTUATION &amp; CONTROL</text>

    <rect x="15" y="55" width="180" height="65" rx="8" fill="#132644" stroke="#0369a1" stroke-width="1"/>
    <text x="25" y="74" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Relay Switch Modules</text>
    <text x="25" y="93" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Optocoupled Isolation</text>
    <text x="25" y="108" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">AC / DC High-Load Switching</text>

    <rect x="15" y="130" width="180" height="65" rx="8" fill="#132644" stroke="#0369a1" stroke-width="1"/>
    <text x="25" y="149" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">State Indicators &amp; Alerts</text>
    <text x="25" y="168" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">OLED I2C Displays</text>
    <text x="25" y="183" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Piezo Buzzers &amp; Status LEDs</text>

    <rect x="15" y="205" width="180" height="80" rx="8" fill="#132644" stroke="#0369a1" stroke-width="1"/>
    <text x="25" y="224" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Real-World Applications</text>
    <text x="25" y="243" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Smart Home Automation</text>
    <text x="25" y="259" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Environmental Sensing</text>
    <text x="25" y="275" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">Industrial Device Monitors</text>
  </g>

  <g stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.8">
    <path d="M 270 200 L 300 200"/>
    <path d="M 270 260 L 300 260"/>
  </g>
  <polygon points="298,200 290,195 290,205" fill="#8b5cf6"/>
  <polygon points="298,260 290,255 290,265" fill="#8b5cf6"/>

  <g stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.8">
    <path d="M 500 200 L 530 200"/>
    <path d="M 500 260 L 530 260"/>
  </g>
  <polygon points="528,200 520,195 520,205" fill="#3b82f6"/>
  <polygon points="528,260 520,255 520,265" fill="#3b82f6"/>

  <text x="400" y="425" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Vansh Saini • Embedded Systems &amp; IoT Automation (2024–2025)</text>
</svg>
